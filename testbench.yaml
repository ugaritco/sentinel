providers:
  - App\Providers\WorkbenchServiceProvider
  - Ugarit\Sentinel\SentinelServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  auth: true
  install: true
  health: false
  discovers:
    web: true
    api: true
    config: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    - db-wipe
    - migrate:fresh
  assets:
    - ugarit-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
